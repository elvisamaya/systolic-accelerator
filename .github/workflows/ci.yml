name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install numpy scikit-learn

      - name: Lint (Verilator -Wall)
        run: make lint

      - name: Unit tests, golden-model regression, SoC, neural network
        run: make test

      - name: Synthesis to SkyWater 130nm
        run: |
          make synth
          cat build/synth_table.md >> "$GITHUB_STEP_SUMMARY"
